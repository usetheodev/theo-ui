  - "The MEDIUM cluster (F-dom-1,2,3,6,7) is one theme: the smallest, highest-risk bucket (cloud-ops, 12 entries) contains agent-surface components mis-routed to the non-AI package, masked by boilerplate rationales and a wiped disputed flag. These are judgment calls flagged for HUMAN adjudication, but the rationale-contradicts-source defect (F-dom-1, F-dom-2) is objective."
  - "Reviewer honesty: I did NOT confirm the intended consumer of audit-log-entry/project-switcher/channel-card with the maintainer; the correct tier is genuinely contestable. What is NOT contestable is that shipping a cloud-ops tag whose rationale says 'Cloud/PaaS dashboard' on a component whose source says 'agent audit log' / 'code agent app sidebar' is an auditability defect."
