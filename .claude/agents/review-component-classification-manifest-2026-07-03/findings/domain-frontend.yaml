    evidence: |
      gateway-status-indicator: tier=ai   docstring "live connection-status dot for a gateway/server"
      status-dot:               tier=generic  "semantic status indicator (colored circle + optional label)"
      status-indicator:         tier=generic
      rationale: boilerplate "AI-agent surface vocabulary (Blueprint §Q2)" — no gateway-specific justification
    recommended_action: >
      Add a component-specific rationale naming WHICH gateway (e.g. MCP/LLM gateway) makes this ai; if it is a
      generic server status, re-tier to generic to match status-dot/status-indicator. Flag for human confirm.

  - id: F-dom-6
    severity: MEDIUM
    file: registry/component-classification.json
    component: "(systemic) 132 of 136 entries"
    plan_ref: "ADR D3 — 'each entry needs a human-authored rationale ... a judgment encoded once'"
    domain_anchor: "manifest rationale-frequency analysis"
    summary: >
      132/136 entries carry one of three verbatim template strings (75× ai, 47× generic, 10× cloud-ops); only
      4 entries have a bespoke rationale. For clear cases (button, card) boilerplate is fine. But on the
      BORDERLINE components (F-dom-1..5) the boilerplate defeats D3's auditability intent — and in F-dom-1/2
      the template rationale actively CONTRADICTS the source docstring. The drift gate cannot catch this: it
      validates tier/target consistency only, never rationale quality. The manifest thus asserts placements
      its own rationale does not defend.
    evidence: |
      distinct rationales: 75x "AI-agent surface vocabulary (Blueprint §Q2) — stays in @theokit/ui"
                           47x "Generic shadcn-like primitive — foundation for @usetheo/ui"
                           10x "Cloud/PaaS dashboard component — @usetheo/ui"
                            4x bespoke (build-log-stream, metrics-panel, env-var-editor, preview-panel)
    recommended_action: >
      Require a component-specific rationale on every cloud-ops entry and on every entry that is not an
      obvious shadcn primitive or an obvious agent primitive. Boilerplate is acceptable only where the tag is
      objectively uncontestable.

  - id: F-dom-7
    severity: MEDIUM
    file: registry/component-classification.json
    component: "(systemic) disputed flag"
    plan_ref: "plan v1.1 T1.2 AC 'EnvVarEditor entry has disputed: true' + TDD test disputed_flag_present_on_envvareditor + Unresolved Q1/Q2"
    domain_anchor: "evidence bundle §6 'Boundary rule ... 0 disputed'"
    summary: >
      The manifest ships with ZERO disputed entries; the plan v1.1 explicitly required disputed: true on
      EnvVarEditor (acceptance criterion + a named TDD test) and Unresolved Q1/Q2 designated EnvVarEditor,
      BuildLogStream, MetricsPanel as disputed pending M-C. Eliminating the flag removed the ONLY mechanism
      the plan had to carry borderline placements forward to M-C. Given ≥4 genuinely borderline components
      surfaced above, "0 disputed" over-claims confidence and erases the audit signal the extraction needs.
      (Primarily a cross-validation concern; raised here because it directly harms classification correctness.)
    evidence: |
      python: disputed entries: []
      plan T1.2 AC: "EnvVarEditor entry has disputed: true"
      plan TDD:     "disputed_flag_present_on_envvareditor() — asserts EnvVarEditor.disputed === true"
      evidence bundle §6: "0 disputed (3 originally-disputed resolved from component evidence)"
    recommended_action: >
      Either (a) restore disputed: true on the genuinely-borderline set (env-var-editor, channel-card,
      audit-log-entry, project-switcher, cron-job-card, build-log-stream, gateway-status-indicator) so M-C
      adjudicates, or (b) formally amend the plan via ADR documenting why every dispute is resolved — do not
      silently diverge from a stated acceptance criterion + its TDD test.

  - id: F-dom-8
    severity: LOW
    file: scripts/classify-components.ts
    line: 107-137, 156
    plan_ref: "rules/error-handling.md (fail-clear); plan T1.1 input-guard cluster"
    domain_anchor: "scripts/classify-components.ts"
    summary: >
      Two minor robustness gaps in otherwise-clean ESM tooling. (1) listTopLevelDirs' readdir() is not
      wrapped; a filesystem error (permissions, race) rejects loadAndCheck, and the CLI dispatch at :156 uses
      .then() with no .catch(), so a rejection surfaces as an unhandled-rejection rather than the typed
      fail-clear message the plan's error-handling contract promises. (2) After Array.isArray, entries are cast
      `as ClassificationEntry[]` without per-entry shape validation; a malformed entry {} degrades to an
      offender message reading "stale entry (no such dir): undefined" rather than a typed "malformed entry".
      Neither is a crash-in-the-happy-path; both are edge/negative-case polish.
    evidence: |
      :107 const listTopLevelDirs = async (path) => ... (await readdir(path, ...)) — no try/catch
      :156 loadAndCheck().then((r) => { ... process.exit(code); });  — no .catch()
      :58  const entries = manifest as ClassificationEntry[];        — no per-entry type guard
    recommended_action: >
      Wrap the CLI in .catch(err => { console.error(...); process.exit(1); }) (or top-level await + try/catch),
      and either validate entry shape or make the stale/offender message tolerate a missing name. Low priority.

notes_for_consolidation:
