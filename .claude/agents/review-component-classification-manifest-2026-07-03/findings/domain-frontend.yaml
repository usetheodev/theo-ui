summary_verdict: >
  The gate script (scripts/classify-components.ts) is clean, correctly-typed ESM tooling — no material
  tooling defects. The high-value risk is in the DATA: the cloud-ops bucket (12 entries) contains
  several components whose own source docstrings describe them as AI-agent surfaces, tagged cloud-ops
  with a boilerplate rationale that CONTRADICTS the source. Because these tags drive a physical MOVE to
  the non-AI @usetheo/ui package in a breaking-major release, a wrong tag mis-routes a genuine agent
  component out of the AI-exclusive product. The evidence bundle's "0 reverse-dep violations" proves
  import-acyclicity only — NOT semantic placement — and "0 disputed" over-claims confidence on ≥4
  genuinely borderline components.

findings:
  - id: F-dom-1
    severity: MEDIUM
    file: registry/component-classification.json
    component: audit-log-entry
    plan_ref: "Blueprint §Q2 (boundary = AI-agent surface vocabulary); plan glossary 'cloud-ops = PaaS/cloud dashboard'"
    domain_anchor: "src/components/primitives/audit-log-entry/audit-log-entry.tsx:43 + :7"
    summary: >
      audit-log-entry is tagged cloud-ops with rationale "Cloud/PaaS dashboard component", but its own
      docstring says "one row in the AGENT audit log" and its type is
      AuditActorKind = "user" | "agent" | "system" (agent rendered with a Bot icon). This is an
      agent-activity log — AI-agent surface vocabulary — not a cloud-platform ops component
      (deploy/domain/rollback/cron/preview/project). The boilerplate rationale directly contradicts the source.
    evidence: |
      manifest entry: { name: "audit-log-entry", tier: "cloud-ops", target: "@usetheo/ui",
                        rationale: "Cloud/PaaS dashboard component — @usetheo/ui" }
      source:
        audit-log-entry.tsx:7   export type AuditActorKind = "user" | "agent" | "system";
        audit-log-entry.tsx:32  agent: Bot,
        audit-log-entry.tsx:43  * AuditLogEntry — one row in the agent audit log. Tells the user exactly
    recommended_action: >
      Re-tier to ai (→ @theokit/ui) OR, if kept cloud-ops, replace the boilerplate rationale with a
      component-specific justification and set disputed: true so M-C adjudicates. Do not ship a tag whose
      rationale contradicts the component's stated purpose.

  - id: F-dom-2
    severity: MEDIUM
    file: registry/component-classification.json
    component: project-switcher
    plan_ref: "Blueprint §Q2; Coverage Matrix #4 (Q2 placement encoded)"
    domain_anchor: "src/components/primitives/project-switcher/project-switcher.tsx:7"
    summary: >
      project-switcher is tagged cloud-ops, but its docstring says "sidebar header for a code agent app...
      anchor the current project context for the session list below. Used in Sidebar.Header". It is the
      coding-agent app chrome, the SAME surface as session-list-item / folder-context-card /
      recent-folders-list — all tagged ai. Tagging it cloud-ops appears keyword-driven ("project" →
      PaaS-project bucket) rather than surface-driven, and would FRACTURE the coding-agent sidebar across
      two packages: an app rendering the agent sidebar would need both @theokit/ui and @usetheo/ui,
      undermining the AI-exclusive value prop.
    evidence: |
      tiers of the shared sidebar surface:
        session-list-item   -> ai
        folder-context-card -> ai
        recent-folders-list -> ai
        project-switcher     -> cloud-ops   <-- outlier
      source project-switcher.tsx:7  * ProjectSwitcher — sidebar header for a code agent app.
                             :  "Used in Sidebar.Header to anchor the current project context for the session list below."
      (Distinct from project-card, which IS a PaaS project dashboard tile — that cloud-ops tag is correct.)
    recommended_action: >
      Re-tier to ai (→ @theokit/ui) to keep the coding-agent sidebar cohesive, OR set disputed: true with a
      surface-specific rationale. Flagged as a contestable judgment call for human adjudication — but the
      keyword-vs-surface mismatch is the objective defect.

  - id: F-dom-3
    severity: MEDIUM
    file: registry/component-classification.json
    component: channel-card
    plan_ref: "Blueprint §Q2; 2026-07-03 scope widening ai to 'chat surfaces' (evidence bundle §6)"
    domain_anchor: "src/components/primitives/channel-card/channel-card.tsx:15 + docstring"
    summary: >
      channel-card is tagged cloud-ops, but it is an inbound messaging-channel connector for
      Telegram/Discord/Slack/WhatsApp/Webhook/MCP ("inbound gateway connection ... showing its connection
      status"). Under the 2026-07-03 scope that explicitly widened ai to include chat surfaces — and given
      the mcp platform is squarely AI-agent — this is a chat/agent-integration surface, not cloud-platform
      ops. Genuinely dual (could be an ops "connections dashboard"), which is exactly why it should not be a
      silent cloud-ops with a boilerplate rationale.
    evidence: |
      channel-card.tsx:15  export type ChannelPlatform = "telegram" | "discord" | "slack" | "whatsapp" | "webhook" | "mcp";
      docstring: "ChannelCard — inbound gateway connection (Telegram, Discord, Slack, …) showing its connection status"
      manifest rationale: "Cloud/PaaS dashboard component — @usetheo/ui" (generic template; no mention of chat/mcp)
    recommended_action: >
      Set disputed: true and record the chat-surface-vs-ops tension explicitly; resolve to ai if the widened
      "chat surfaces" scope governs (the mcp platform argues for ai). At minimum do not carry the generic
      cloud-ops boilerplate on a genuinely dual component.

  - id: F-dom-4
    severity: LOW
    file: registry/component-classification.json
    component: cron-job-card, cron-jobs-list
    plan_ref: "Blueprint §Q2 placement table (CronJobCard/CronJobsList → @usetheo/ui, 'PaaS scheduling ops')"
    domain_anchor: "src/components/primitives/cron-job-card/cron-job-card.tsx:15,46"
    summary: >
      cron-job-card is tagged cloud-ops and this FOLLOWS the blueprint placement table, so it is defensible.
      But the component is "one scheduled AGENT job. Shows cron expression, PROMPT, status" — CronJob.prompt =
      "What gets run (prompt or command)". Scheduling an agent to run a prompt is agent-surface vocabulary, not
      generic PaaS cron. This is the blueprint's own EC-4 interpretive risk materializing: the placement was
      name-derived; the component evidence leans ai. Flagged as tension, not a hard defect.
    evidence: |
      cron-job-card.tsx:15  /** What gets run (prompt or command). */  prompt: string;
      cron-job-card.tsx:46  * CronJobCard — one scheduled agent job. Shows cron expression, prompt, status, last/next run.
      manifest rationale: "Cloud/PaaS dashboard component — @usetheo/ui"
    recommended_action: >
      Keep cloud-ops per the blueprint OR set disputed: true given the agent-prompt evidence; either way,
      replace the boilerplate rationale with the actual prompt-scheduling reasoning so M-C can re-adjudicate.

  - id: F-dom-5
    severity: LOW
    file: registry/component-classification.json
    component: gateway-status-indicator
    plan_ref: "Blueprint §Q2; parsimony of rationale (plan D3 human-authored rationale)"
    domain_anchor: "src/components/primitives/gateway-status-indicator/gateway-status-indicator.tsx (docstring)"
    summary: >
      gateway-status-indicator is tagged ai with the generic boilerplate rationale, but structurally it is a
      status dot ("live connection-status dot for a gateway/server", variants compact/labeled) — the same
      shape as status-dot and status-indicator, both tagged generic. "gateway" is ambiguous (AI/LLM gateway
