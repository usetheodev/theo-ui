findings:
  - id: F-xval-1
    severity: HIGH
    file: registry/component-classification.json
    line: n/a (whole-file — no `disputed` key on any of 136 entries)
    plan_ref: >
      T1.2 Acceptance Criteria "`EnvVarEditor` entry has `disputed: true`";
      Objective bullet 3; Coverage Matrix row 5; Unresolved Q1/Q2; planned test
      `disputed_flag_present_on_envvareditor`.
    summary: >
      Plan v1.1 mandates disputed:true on EnvVarEditor (and treats BuildLogStream/MetricsPanel as
      disputed borderline). The implementation instead RESOLVED all disputes to 0 and stripped the
      `disputed` key entirely, then replaced the plan-mandated test with its logical inverse
      (`boundary_fully_resolved_no_disputed_entries`). A direct contradiction of an explicit AC + a
      Coverage-Matrix commitment, changed mid-implementation, with NO ADR amending the plan contract.
    evidence: |
      jq '[.[] | select(has("disputed"))] | length' -> 0   (plan requires >=1 disputed:true)
      env-var-editor: {tier: cloud-ops, target: @usetheo/ui, disputed: null}
      git -S 'disputed_flag_present_on_envvareditor' shows the plan test was committed (b967fbe) then
      removed (f14766a "resolve the 3 disputed classifications with component evidence").
      Rationale is documented in the evidence bundle §5/§6, CHANGELOG, and commits — divergence is
      TRANSPARENT, not silent — but it was never formalized as an ADR or a plan v1.2 revision.
    recommended_action: >
      Formalize the 2026-07-03 scope decision as ADR D4 (in the plan or an implementation summary doc)
      that supersedes the disputed-flag requirement, and note in the plan that Coverage-Matrix row 5 /
      Objective bullet 3 were satisfied by full resolution rather than by flagging. Do NOT revert —
      resolution is defensible and evidence-backed; the gap is the missing contract amendment.

  - id: F-xval-2
    severity: MEDIUM
    file: CHANGELOG.md
    line: 14
    plan_ref: T1.2 DoD "CHANGELOG updated under [Unreleased]"; Unbreakable Rule 6 (public contract accuracy)
    summary: >
      CHANGELOG states the split as "76 `ai` ... 60 (generic + cloud-ops)" but the shipped manifest is
      77 ai / 59 non-AI (47 generic + 12 cloud-ops). The number went stale after commit 045608f
      reclassified preview-panel to `ai` (76->77), which landed AFTER the CHANGELOG line was written (8fd6e84).
    evidence: |
      CHANGELOG.md:14 "Current split: 76 `ai` stay in `@theokit/ui`; 60 ... `@usetheo/ui`"
      jq tier split -> ai:77, generic:47, cloud-ops:12  => 77/59
      Evidence bundle §6 correctly says "77 ai / 59 non-AI"; the review report (a49749b) and CHANGELOG
      both still say 76/60. The public contract carries the wrong number.
    recommended_action: Update CHANGELOG.md:14 to "77 `ai` ... 59 (47 generic + 12 cloud-ops)".

  - id: F-xval-3
    severity: LOW
    file: scripts/classify-components.test.ts
    line: n/a (file reports 16 passed)
    plan_ref: T1.1 Acceptance Criteria "pnpm test scripts/classify-components.test.ts reports `10 passed`"
    summary: >
      Literal AC wording ("10 passed") is not met — the suite reports 16 passed. All 10 plan-named RED
      tests exist and pass; 6 extra tests were added (report×2, passes_against_the_real_authored_manifest,
      and the three T1.2 manifest tests). Intent (all RED green) is exceeded, not violated.
    evidence: |
      vitest run -> "Tests  16 passed (16)". The 10 named RED tests all present:
      fails_when_ondisk_dir_missing_from_manifest, ..._references_nonexistent_dir, ..._tier_invalid,
      ..._target_inconsistent_with_tier, fails_clear_when_malformed_json (plan: fails_clear_on_malformed_json),
      fails_clear_when_manifest_absent, fails_clear_when_manifest_not_array, fails_when_duplicate_entry,
      fails_when_declared_layer_mismatches_location, passes_when_every_dir_classified_and_consistent.
    recommended_action: >
      No code change needed. Optionally reword the AC to ">=10 passed" for accuracy; note the
      minor rename fails_clear_on_malformed_json -> fails_clear_when_malformed_json.

  - id: F-xval-4
    severity: LOW
    file: .claude/knowledge-base/implementations/
    line: n/a
    plan_ref: cycle-implement.md (halt-loop contract, progress checkpoint, {slug}-implementation.md summary)
    summary: >
      Milestone A was implemented INLINE, not through the cycle-implement ralph-loop halt-loop. There is
      no `.progress-component-classification-manifest.json` checkpoint and no
      `component-classification-manifest-implementation.md` summary. The per-iteration checkpoint /
