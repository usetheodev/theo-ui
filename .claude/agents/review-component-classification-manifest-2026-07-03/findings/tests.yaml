  - "Strong negative-case coverage per testing.md §4.1: absent / malformed / non-array / duplicate / layer-mismatch / invalid-tier / target-mismatch each isolated to a single offender and asserting a typed keyword — not merely 'it fails'."
  - "Clean testability design: pure checkClassification separated from I/O loadAndCheck; report() (exit-code render) both branches asserted."
  - "passes_against_the_real_authored_manifest is a genuine end-to-end anchor over the real 136-entry manifest + real component roots (classifiedCount === 136, ok === true)."
  - "AAA structure clear; behavior-named snake_case tests; no 'and' in names; zero .only / .skip / xit / commented-out tests (Unbreakable Rule 7 clean)."
  - "Suite is deterministic and fast: 16/16 green, 8ms test time; temp-dir I/O tests clean up in afterAll."
  - "Benchmark-driven O(n^2)->O(n) duplicate-detection fix (0b6c5c2) is backed by the Set-based path the duplicate test guards."
