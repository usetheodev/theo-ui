findings:
  - id: F-wire-1
    severity: INFO
    file: tsup.config.ts
    line: 102
    plan_ref: T3.1 (.d.ts per subpath)
    summary: Stale comment references a non-existent script `scripts/emit-dts.ts`; the real wiring uses `tsc -p tsconfig.dts.json` in package.json#build.
    evidence: |
      tsup.config.ts:102 comment: "emitted SEPARATELY by `tsc --emitDeclarationOnly`
      (see `scripts/emit-dts.ts`, wired into `package.json#build`)". No emit-dts.ts
      exists; package.json#build actually runs `tsc -p tsconfig.dts.json`. The
      wiring is correct and live — only the comment's filename is stale. No
      functional impact (dts emission verified: 140 index.d.ts under dist/components).
    recommended_action: Update the comment to reference `tsc -p tsconfig.dts.json` instead of the non-existent `scripts/emit-dts.ts`. Cosmetic, non-blocking.

  - id: F-wire-2
    severity: INFO
    file: scripts/codemod-data-variant.ts
    line: 1
    plan_ref: T5.1 (cva/data-variant)
    summary: codemod-data-variant.ts has no programmatic caller and is not referenced by any other file (codemod-data-slot.ts at least appears in a gate error string).
    evidence: |
      grep across package.json/scripts/tsup found zero references to
      codemod-data-variant. This is BY DESIGN — it is an idempotent one-shot
      codemod (documented header: "Run via: npx tsx scripts/codemod-data-variant.ts").
      knip does not flag it (scripts/*.ts are treated as entry points). The
      result of running it (data-variant/data-size on 9 components) is what is
      protected going forward — via validateDataSlot's family and the data-variant
      component tests, not the script itself.
    recommended_action: None required. Codemods are one-shot historical tooling, correctly not in the build chain. Optionally note them as "applied; retained for reproducibility" in the audit-trail.

  - id: F-wire-3
    severity: INFO
    file: scripts/validate-quality-gates.ts
    line: 909
    plan_ref: T1.2 (validateUseClientDirective gate)
    summary: validateUseClientDirective is a no-op when dist/ is absent (`if (!existsSync(distRoot)) return;`), so a standalone `quality:structure` run with no prior build silently skips the RSC regression check.
    evidence: |
      L909: `if (!existsSync(distRoot)) return;`. In `quality:gates` this is safe
      because `pnpm build` always precedes `quality:structure`. The gate's own
      docstring acknowledges this ("Skips gracefully when dist/ is absent"). The
      data-slot gate reads source (no build needed), so it is unaffected.
    recommended_action: Acceptable as designed (matches the RSC-smoke test's skipIf(!hasDist) behavior). No change needed; the gate is real and fires in the full chain.

