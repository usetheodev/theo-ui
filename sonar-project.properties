# SonarQube Cloud analysis scope, generated from this repository's real layout.
#
# Source roots are stated explicitly rather than discovered. Left to discovery the scanner also
# reads generated output and reports duplication between a source file and its own generated copy.
# Measured here on 2026-08-29: `registry/r/theme-provider.json` embeds 1338 lines, six of its
# seven entries 99.8-100% identical to the file under `src/themes/` they were generated from. Any
# PR touching a theme regenerated that artifact and scored ~42% duplicated new code — a number
# about the generator, not about the change.

sonar.projectKey=usetheokit_theokit-ui
sonar.organization=usetheokit

sonar.sources=packages/ui/src,packages/ui/tests/fixture-shadcn-app/src
sonar.tests=packages/ui/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/dist/**,**/build/**,**/coverage/**,**/node_modules/**,**/*.d.ts,**/*.stories.tsx,wiki/**

# No `sonar.javascript.lcov.reportPaths` here on purpose. Analysis runs as the SonarCloud GitHub
# App, which does not execute the suite, so nothing writes an lcov report. A path listed here that
# the build never writes reports 0% while the suite is green, and that zero is indistinguishable
# from a measured one. Add the line in the same change that makes CI produce the file.

sonar.sourceEncoding=UTF-8

# NOTHING BELOW THIS LINE, AND POSSIBLY NOTHING ABOVE IT, IS IN EFFECT TODAY.
#
# This project runs SonarCloud's AUTOMATIC ANALYSIS (the GitHub App), which does not read this
# file. Measured 2026-08-29: `sonar.sources` above names `packages/ui/src`, and the analysis
# nevertheless reports findings in `.github/workflows/ci.yml` and `packages/ui/scripts/**` — 19
# analysed files outside the declared roots. So the scope is not being applied either.
#
# An `sonar.issue.ignore.multicriteria` block for `githubactions:S7637` sat here and was removed
# rather than left looking like a control. The repository accepts that rule for
# `usetheokit/shared-workflows` — the reasoning is above the `uses:` line in `dep-check.yml` —
# but an exemption the analyser never reads is not an exemption, and a reader would have taken
# it for one.
#
# To make this file live, the project must switch to CI-based analysis, as the sibling `theokit`
# does: a `sonar` job calling `usetheokit/shared-workflows/.github/workflows/sonar.yml@v1` with
# the `SONAR_TOKEN` this repository already holds. That switch REQUIRES turning Automatic
# Analysis off first — the scanner refuses to run beside it ("You are running CI analysis while
# Automatic Analysis is enabled"), so wiring the job while the App is on would only add a red
# check. Until then, accepted findings are recorded in the SonarCloud UI.
#
# Kept rather than deleted because it is correct for the analysis method this project should be
# on, and because deleting it would lose the measurement above.
