# SonarQube Cloud analysis scope, generated from this repository's real layout.
#
# Source roots are stated explicitly rather than discovered. Left to discovery the scanner also
# reads generated output and reports duplication between a source file and its own generated copy.
# Measured here on 2026-08-29: `registry/r/theme-provider.json` embeds 1338 lines, six of its
# seven entries 99.8-100% identical to the file under `src/themes/` they were generated from. Any
# PR touching a theme regenerated that artifact and scored ~42% duplicated new code — a number
# about the generator, not about the change.

sonar.projectKey=usetheokit_theokit-ui
sonar.organization=usetheokit

sonar.sources=packages/ui/src,packages/ui/tests/fixture-shadcn-app/src
sonar.tests=packages/ui/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/dist/**,**/build/**,**/coverage/**,**/node_modules/**,**/*.d.ts,**/*.stories.tsx,wiki/**

# No `sonar.javascript.lcov.reportPaths` here on purpose. Analysis runs as the SonarCloud GitHub
# App, which does not execute the suite, so nothing writes an lcov report. A path listed here that
# the build never writes reports 0% while the suite is green, and that zero is indistinguishable
# from a measured one. Add the line in the same change that makes CI produce the file.

sonar.sourceEncoding=UTF-8

# S7637 ("use a full commit SHA") is accepted for `usetheokit/shared-workflows` only, and the
# reasoning is recorded in `.github/workflows/dep-check.yml` above its `uses:` line: the rule
# defends against a THIRD PARTY moving a ref, and shared-workflows is this same organisation.
# A SHA would buy a guarantee we already have and cost the central correction a reusable
# workflow exists to make — pinning N callers turns one fix into N pull requests. The tool the
# workflow runs is separately pinned to an exact version, so what it detects never changes
# overnight.
#
# Declared here rather than resolved as "Won't fix" in the SonarCloud UI so the exemption
# travels in git, is reviewed like any other change, and states its reason next to itself. It
# is the same acceptance `# zizmor: ignore[unpinned-uses]` already records one tool over.
#
# Scoped to the rule and to `.github/workflows/**` deliberately. A blanket exclusion would also
# swallow a genuinely unpinned THIRD-PARTY action, which is the case the rule is for and which
# nothing else here would catch. Every third-party action in these files is SHA-pinned today.
sonar.issue.ignore.multicriteria=sharedWorkflowsTag
sonar.issue.ignore.multicriteria.sharedWorkflowsTag.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.sharedWorkflowsTag.resourceKey=.github/workflows/**

