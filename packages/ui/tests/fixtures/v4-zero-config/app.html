<!DOCTYPE html>
<html>
  <head>
    <title>Theo UI v4 zero-config fixture</title>
    <link rel="stylesheet" href="./entry.css" />
  </head>
  <body>
    <!-- Utility classes the @theokit/ui components actually use. Tailwind
         must emit a rule for each — the dogfood asserts on the emitted CSS. -->
    <button
      class="bg-primary text-primary-foreground border border-border rounded-md text-body-sm max-w-md font-sans"
    >
      Deploy
    </button>
    <p class="text-muted-foreground text-body-md">muted body copy</p>
    <p class="text-foreground text-body-lg">large body</p>
    <div class="bg-card text-card-foreground p-5 shadow-md">card surface</div>
    <span class="bg-accent text-accent-foreground">accent</span>
    <span class="text-display-2xl font-display">display headline</span>
    <pre class="font-mono text-code-md">code snippet</pre>
  </body>
</html>
