# File-naming rules for the source tree.
#
# The convention was ALREADY 100% honoured when this file was added on 2026-08-21 —
# 538 source files, zero violations, with nothing enforcing it. This exists so the
# regression is caught the day it happens rather than discovered in a review later.
#
# `.stories.tsx`, `.test.tsx` and `.a11y.test.tsx` all pass the same rule because
# ls-lint matches on the basename before the FIRST dot, so `chat-message.test.tsx`
# is checked as `chat-message`.
ls:
  src:
    .ts: regex:^[a-z][a-z0-9-]*$
    .tsx: regex:^[a-z][a-z0-9-]*$
  src/**:
    .ts: regex:^[a-z][a-z0-9-]*$
    .tsx: regex:^[a-z][a-z0-9-]*$
  scripts:
    .ts: regex:^[a-z][a-z0-9-]*$
    .mjs: regex:^[a-z][a-z0-9-]*$
  scripts/**:
    .ts: regex:^[a-z][a-z0-9-]*$
    .mjs: regex:^[a-z][a-z0-9-]*$
  tests/**:
    .ts: regex:^[a-z][a-z0-9-]*$
    .tsx: regex:^[a-z][a-z0-9-]*$
  codemod:
    .mjs: regex:^[a-z][a-z0-9-]*$

ignore:
  - node_modules
  - dist
  - build
  - coverage
  - test-results
  - .git
  - .claude
  - registry
  # Vendored fixture app: its layout is shadcn's, not ours.
  - tests/fixture-shadcn-app
  # Generated by sync-readme.ts.
  - .ladle/generated
