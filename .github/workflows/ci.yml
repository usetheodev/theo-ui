name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on an integration branch leaves the commit with no verdict,
  # which reads the same as a passing one. Only supersede elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  verify:
    name: Verify (quality gates)
    runs-on: ubuntu-latest
    # 40, not 20, and the number is measured rather than picked.
    #
    # `quality:gates` runs twenty-five steps in series — lint, types, 1673 tests, build, contract
    # tests, packaging, registry, bundle, contrast, a11y, visual, a Ladle build and five dogfood
    # scaffolds. Recent runs took 7, 8, 12, 15, 15, 16 minutes, and one hit 20m26s and was killed
    # at exactly the ceiling. A suite that grows past its own timeout reports `cancelled`, which
    # reads like an infrastructure hiccup and is not one — I attributed two of these to runner
    # contention before measuring.
    #
    # Raising the ceiling buys room; it does not make the job faster. The real fix is splitting
    # those twenty-five steps into parallel jobs, so a red lint does not wait behind a Ladle build.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The install spine — Node, the package manager this repository DECLARES, a cache keyed
      # so it cannot outlive that manager, and a frozen install. Shared because it was the
      # same four steps in nine repositories, and because the knowledge inside them was not:
      # theokit-sdk pinned pnpm 9.15.0 in four workflows while its manifest said 10.34.1, so
      # every gate there validated a tree no contributor had (usetheokit/theokit-sdk#415).
      #
      # @v1 is a moving major and the blanket SHA-pinning policy is suppressed for it: that
      # policy defends against a THIRD PARTY moving a ref under us, and this is the same
      # organisation. What a SHA would buy is a guarantee we already have; what it would cost
      # is one correction becoming nine pull requests. What the action RUNS stays pinned —
      # every action inside it by digest, and the package manager by this repository's manifest.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]

      # T5.3 (community-best-practices plan, ADR-0005 cohort): install Playwright
      # Chromium so `pnpm quality:visual` runs as part of `pnpm quality:gates`.
      # Linux Chromium binary is cached by the actions/setup-node step above
      # via pnpm — no separate cache needed.
      - name: Install Playwright Chromium
        working-directory: packages/ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Run quality gates
        run: pnpm quality:gates

  # T6.3 (agent-team-audit-fixes plan): React 19 compatibility job.
  # Overrides React to 19.x over the locked tree, then runs typecheck +
  # test to surface incompatibilities. `continue-on-error: true` means
  # failures here do NOT block the PR — we gather evidence first, then
  # decide whether to promote it to a required check. The peer range
  # `"react": ">=18.2.0"` already permits 19 numerically; this proves
  # the library actually compiles and tests against it.
  react-19-compat:
    name: react@19 compat (allow-failure)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json

      # React 19 is pinned into package.json and BOTH the lockfile and node_modules are
      # removed, so the tree resolves from scratch with the overrides already in place.
      #
      # Every cheaper variant was tried and measured, and each left TWO copies of
      # @types/react — 18.3.28 for `@usetheo/ui`'s peer alongside 19.2.18 at the root:
      #
      #   pnpm add -D react@^19 ...                        -> 2 copies   (the original)
      #   + pnpm.overrides, install over the lockfile      -> 2 copies
      #   + delete pnpm-lock.yaml, keep node_modules       -> 2 copies
      #   + delete node_modules as well                    -> 1 copy     OK
      #
      # pnpm does not prune a store entry that an existing node_modules still points at, so
      # the stale resolution survives everything short of removing it. Two copies means two
      # `ReactNode` unions, and every value crossing between them fails to assign — which is
      # what produced five phantom `bigint` errors here for months, while hiding 21 real
      # ones. See usetheokit/theokit-ui#45.
      #
      # There is no separate baseline install: this job never uses the locked tree, and
      # installing one only to delete it wasted a minute per run.
      #
      # The trade-off is deliberate. Resolving afresh means this is not byte-for-byte the
      # tree that ships — which is what a compatibility probe wants, since the question is
      # whether this SOURCE works against React 19, not whether today's lockfile does. The
      # shipping tree is what `quality:gates` verifies, on the locked install, in the job
      # above.
      - name: Install with React 19 across the whole tree
        run: |
          # In a subshell rather than `pnpm --dir packages/ui`: `pnpm pkg` takes no
          # directory flag and swallows the value as a command name, failing with
          # `Command "packages/ui" not found` (measured, run 32776375180).
          ( cd packages/ui && pnpm pkg set \
            "devDependencies.react=^19" \
            "devDependencies.react-dom=^19" \
            "devDependencies.@types/react=^19" \
            "devDependencies.@types/react-dom=^19" )
          # `pnpm.overrides` is only honoured in the workspace-root manifest. Setting it
          # on the package would be accepted and then ignored — the job would go green
          # over a tree that never saw React 19.
          pnpm pkg set \
            "pnpm.overrides.react=^19" \
            "pnpm.overrides.react-dom=^19" \
            "pnpm.overrides.@types/react=^19" \
            "pnpm.overrides.@types/react-dom=^19"
          # Pin every OTHER peer to what the lockfile resolved, so this job changes exactly
          # one variable. Dropping the lockfile re-resolves the whole graph, which quietly
          # turned this into a "React 19 + newest everything" probe: CI picked
          # @usetheo/ui@0.35.1 where the lockfile pins 0.22.0, and the failure that produced
          # was a real defect about peer drift (#50) wearing a React 19 label. One job, one
          # question.
          USETHEO_UI=$(grep -A2 "'@usetheo/ui':" pnpm-lock.yaml | grep 'version:' | head -1 | sed 's/.*version: //; s/(.*//')
          if [ -z "$USETHEO_UI" ]; then
            echo "::error::Could not read the locked @usetheo/ui version from pnpm-lock.yaml. Refusing to resolve it freely — that would make this job test more than React 19."
            exit 1
          fi
          echo "Pinning @usetheo/ui to the locked $USETHEO_UI"
          pnpm pkg set "pnpm.overrides.@usetheo/ui=$USETHEO_UI"

          rm -rf pnpm-lock.yaml node_modules
          pnpm install --no-frozen-lockfile

      - name: Assert a single copy of @types/react
        run: |
          # `find -maxdepth 1` rather than `ls`: ls formats for a human and its output
          # cannot be counted safely once a name carries a space or a newline. These
          # names never do, but the gate should not depend on that staying true.
          copies=$(find node_modules/.pnpm -maxdepth 1 -name '@types+react@*' | wc -l)
          echo "@types/react copies in the tree: $copies"
          find node_modules/.pnpm -maxdepth 1 -name '@types+react@*' || true
          if [ "$copies" -ne 1 ]; then
            echo "::error::Expected exactly 1 copy of @types/react; found $copies. Any type error below would be an artifact of the install, not a React 19 finding."
            exit 1
          fi

      - name: Typecheck against React 19
        run: pnpm --filter=@theokit/ui run typecheck

      - name: Test against React 19
        run: pnpm --filter=@theokit/ui run test
