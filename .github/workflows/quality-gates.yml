name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality:gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # T5.3 (community-best-practices plan, ADR-0005 cohort): install Playwright
      # Chromium so `pnpm quality:visual` runs as part of `pnpm quality:gates`.
      # Linux Chromium binary is cached by the actions/setup-node step above
      # via pnpm — no separate cache needed.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run quality gates
        run: pnpm quality:gates

  # T6.3 (agent-team-audit-fixes plan): React 19 compatibility job.
  # Overrides React to 19.x over the locked tree, then runs typecheck +
  # test to surface incompatibilities. `continue-on-error: true` means
  # failures here do NOT block the PR — we gather evidence first, then
  # decide whether to promote it to a required check. The peer range
  # `"react": ">=18.2.0"` already permits 19 numerically; this proves
  # the library actually compiles and tests against it.
  react-19-compat:
    name: react@19 compat (allow-failure)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (baseline lockfile)
        run: pnpm install --frozen-lockfile

      # `pnpm add -D` alone is NOT enough, and for months it made this job lie.
      #
      # It bumps the ROOT dependencies and leaves every transitive peer resolution where the
      # lockfile put it. `@usetheo/ui` is a required peer whose own `@types/react` stayed at
      # 18, so the tree ended up with TWO copies (measured 2026-08-21: 18.3.28 and 19.2.18).
      # Two copies means two different `ReactNode` unions, and every value crossing between
      # them fails to assign — producing 5 phantom `Type 'bigint' is not assignable to type
      # 'ReactNode'` errors that say nothing about React 19 compatibility.
      #
      # Worse, they masked the real ones. With a coherent single-copy tree the same commit
      # reported 24 errors, of which 21 were the real React 19 break (the global `JSX`
      # namespace was removed). The job was UNDER-reporting incompatibility while appearing
      # to over-report it. See usetheokit/theokit-ui#45.
      #
      # `pnpm.overrides` forces one copy across the whole graph, transitive peers included.
      - name: Override React to 19 across the whole tree
        run: |
          pnpm pkg set \
            "pnpm.overrides.react=^19" \
            "pnpm.overrides.react-dom=^19" \
            "pnpm.overrides.@types/react=^19" \
            "pnpm.overrides.@types/react-dom=^19"
          pnpm add -D react@^19 react-dom@^19 @types/react@^19 @types/react-dom@^19
          pnpm install --no-frozen-lockfile

      # Fail loudly on a tree this job cannot draw a conclusion from, rather than reporting
      # whatever a mixed install happens to produce.
      - name: Assert a single copy of @types/react
        run: |
          copies=$(ls -d node_modules/.pnpm/@types+react@* 2>/dev/null | wc -l)
          echo "@types/react copies in the tree: $copies"
          ls -d node_modules/.pnpm/@types+react@* 2>/dev/null || true
          if [ "$copies" -ne 1 ]; then
            echo "::error::Expected exactly 1 copy of @types/react; found $copies. Any type error below would be an artifact of the install, not a React 19 finding."
            exit 1
          fi

      - name: Typecheck against React 19
        run: pnpm typecheck

      - name: Test against React 19
        run: pnpm test
