# Read by SonarCloud's AUTOMATIC ANALYSIS (the GitHub App), which is the mode this project runs.
# Different file from `sonar-project.properties`, which the scanner reads and which automatic
# analysis ignores — measured 2026-08-29; see that file's header.
#
# `sonar.issue.ignore.multicriteria` was tried here first and did NOT take effect: PR #130's head
# carried it and the analysis afterwards still reported all nine `githubactions:S7637` findings.
# Scope properties are a different class from issue filters, so this is a separate question, and
# it is answered the same way — by pushing it and reading the result, not by assuming.

# Workflow files are out of scope for SonarCloud here, because something better already covers
# them and is REQUIRED on `main`: `lint / actionlint + zizmor`, a check whose entire job is
# workflow validity and safety. Sonar analysing them adds a second opinion that disagrees with
# this repository's recorded position on `usetheokit/shared-workflows` refs (see the comment above
# the `uses:` line in `.github/workflows/dep-check.yml`) and can only be reconciled in a UI, where
# the reason would not travel in git.
#
# This is a narrower claim than "workflows do not need review". What it says is that the review
# belongs to the tool built for it. Three things cover what Sonar would have:
#
#   1. zizmor — required on `main`, and it is the tool that knows GitHub Actions threat models.
#   2. `packages/ui/tests/contract/third-party-actions-are-pinned.test.ts` — every `uses:` outside
#      `usetheokit/*` must carry a 40-character SHA. Verified to fail when one does not.
#   3. `githubactions:S8264` ("move this read permission to job level") was a real finding standing
#      behind the nine, and it is FIXED in the code — permissions are per-job now, `ci-ok` on `{}`.
#      It was found and fixed before this exclusion existed, not hidden by it.
#
# If this does not take effect either, it comes out, and the acceptance is recorded in the
# SonarCloud UI instead.
sonar.exclusions=.github/workflows/**
