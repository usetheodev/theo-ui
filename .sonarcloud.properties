# Read by SonarCloud's AUTOMATIC ANALYSIS (the GitHub App), which is the mode this project runs.
# This is a different file from `sonar-project.properties`, which the scanner reads and which
# automatic analysis ignores — measured 2026-08-29, see the header of that file.

# `githubactions:S7637` ("use a full commit SHA") is accepted for `usetheokit/shared-workflows`
# only. The reasoning is recorded above the `uses:` line in `.github/workflows/dep-check.yml`:
# the rule defends against a THIRD PARTY moving a ref, and shared-workflows is this same
# organisation. A SHA would buy a guarantee we already have and cost the central correction a
# reusable workflow exists to make — pinning N callers turns one fix into N pull requests. The
# tool that workflow runs is separately pinned to an exact version, so what it detects never
# changes overnight.
#
# Declared here rather than resolved as "Won't fix" in the UI so the exemption travels in git,
# is reviewed like any other change, and states its reason beside itself — the same acceptance
# `# zizmor: ignore[unpinned-uses]` already records one tool over.
#
# Scoped to the rule and to the workflows directory on purpose. A blanket exclusion of that
# directory would also swallow a genuinely unpinned THIRD-PARTY action — and it would have
# swallowed `githubactions:S8264` ("move this read permission to job level"), which was a real
# finding hiding behind these nine and is now fixed in the code rather than silenced.
#
# The remaining half — that third-party actions really are pinned — is asserted by
# `packages/ui/tests/contract/third-party-actions-are-pinned.test.ts`, which fails when one is not.
sonar.issue.ignore.multicriteria=sharedWorkflowsTag
sonar.issue.ignore.multicriteria.sharedWorkflowsTag.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.sharedWorkflowsTag.resourceKey=.github/workflows/**
